version: 2

project_name: lazytg

before:
  hooks:
    - go mod tidy

builds:
  - id: lazytg
    main: ./cmd/lazytg
    binary: lazytg
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/pgmac/lazytg/cmd/lazytg/cmd.version={{.Version}}
      - -X github.com/pgmac/lazytg/cmd/lazytg/cmd.commit={{.Commit}}
      - -X github.com/pgmac/lazytg/cmd/lazytg/cmd.date={{.Date}}
    flags:
      - -trimpath

archives:
  - id: default
    ids: [lazytg]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

nfpms:
  - id: default
    package_name: lazytg
    vendor: lazytg contributors
    homepage: https://github.com/pgmac/lazytg
    maintainer: pgmac <noreply@github.com>
    description: |
      Local-first Telegram TUI client with FTS5 search.
      Telegram automatically puts unofficial clients under observation.
      Use with a test account first.
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    ids:
      - lazytg
    contents:
      - src: LICENSE
        dst: /usr/share/doc/lazytg/LICENSE
      - src: README.md
        dst: /usr/share/doc/lazytg/README.md

brews:
  - name: lazytg
    ids:
      - default
    repository:
      owner: pgmac
      name: homebrew-lazytg
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/pgmac/lazytg
    description: Local-first Telegram TUI client with FTS5 search
    license: MIT
    skip_upload: '{{ if .Prerelease }}true{{ end }}'
    install: |
      bin.install "lazytg"
    test: |
      system "#{bin}/lazytg", "version"
    caveats: |
      Telegram automatically puts unofficial clients under observation.
      Use lazytg with a test account first. See:
      https://github.com/pgmac/lazytg/blob/main/docs/SECURITY.md

      Set LAZYTG_API_ID and LAZYTG_API_HASH env vars before first run.
      Get them at https://my.telegram.org/apps

signs:
  # Подпись checksums.txt — сохраняем как было (быстрая верификация всего набора).
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - --yes
    output: true

  # Per-archive подпись через sigstore bundle (cosign sign-blob --bundle).
  # Это даёт возможность пользователям проверять конкретный архив без скачивания
  # всех файлов — `cosign verify-blob --bundle <archive>.sigstore.json <archive>`.
  - id: archives
    cmd: cosign
    artifacts: archive
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    output: true

release:
  prerelease: auto
  draft: false
  name_template: "lazytg {{ .Version }}"
  github:
    owner: pgmac
    name: lazytg
  header: |
    ## lazytg {{ .Version }}

    > ⚠️ Telegram automatically puts unofficial clients under observation. Use lazytg with a test account first. See [SECURITY.md](https://github.com/pgmac/lazytg/blob/main/docs/SECURITY.md).

    Pure-Go build, single static binary. Database is unencrypted by default — rely on filesystem permissions (the startup permissions audit enforces `0600`/`0700`) and OS-level disk encryption. SQLCipher (CGo, opt-in) is deferred past v0.1.
  footer: |
    **Full Changelog**: https://github.com/pgmac/lazytg/compare/{{ .PreviousTag }}...{{ .Tag }}
