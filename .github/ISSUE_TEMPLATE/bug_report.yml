name: Bug report
description: Report a defect in lazytg
title: "bug: <short description>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in **all** required sections — incomplete reports are slow to triage.

        **Do not paste session strings, `api_hash`, or message content.** Run `lazytg debug-bundle` and attach the redacted output instead — it bundles version + config (scrubbed) + logs (scrubbed) + DB stats + goroutines into a single tar.gz under your CWD. The CI grep-test guarantees no session blob / api_hash / phone / message-text fixture appears in the bundle.

        **Suspect a security issue?** Do **not** file a public report. Use [GitHub Security Advisories](https://github.com/pgmac/lazytg/security/advisories/new). See [`docs/SECURITY.md`](https://github.com/pgmac/lazytg/blob/main/docs/SECURITY.md) for the disclosure policy.
  - type: input
    id: version
    attributes:
      label: lazytg version
      description: Output of `lazytg version`
      placeholder: "lazytg v0.1.0-alpha.1, commit abc1234, built 2026-05-02"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (arm64)
        - macOS (amd64)
        - Linux (amd64)
        - Linux (arm64)
        - Other
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS version
      placeholder: "macOS 15.4, Ubuntu 24.04, ..."
    validations:
      required: true
  - type: dropdown
    id: build_tag
    attributes:
      label: Build mode
      description: |
        Pure-Go is the only shipped build for v0.1. The `sqlcipher` build tag is reserved for a future CGo driver and currently fails to compile on purpose (see internal/storage/sqlite/driver_sqlcipher.go).
      options:
        - Default (pure Go, modernc/sqlite)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Be precise. Number the steps.
      placeholder: |
        1. `export LAZYTG_API_ID=...; export LAZYTG_API_HASH=...`
        2. `lazytg login --account +7XXX`
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste the relevant tail of the lazytg log file (rotated under `$XDG_STATE_HOME/lazytg/`),
        or the output of `lazytg --debug ...`. **Make sure secrets are redacted** —
        the built-in redactor handles phone numbers / api_hash / session strings, but double-check.
      render: shell
  - type: textarea
    id: debug_bundle
    attributes:
      label: debug-bundle
      description: |
        Run `lazytg debug-bundle` in the affected environment. A `lazytg-debug-bundle-<timestamp>.tar.gz`
        will land in your CWD with mode 0600. **Drag-and-drop the file into this textarea** (GitHub will
        upload and inline a link). If it is too large for an issue attachment, upload to a private gist
        and paste the URL here.

        The bundle contains: `version.txt`, `config.toml` (api_hash + phone scrubbed), `logs.txt`
        (redactor applied), `db_stats.txt` (row counts only, no message text), `goroutines.txt`.
        It does **not** contain: session blobs, raw `api_hash`, message bodies, contact lists,
        peer access hashes, the SQLite DB file. CI enforces this via `bundle_grep_test.go`.
      placeholder: "Drop lazytg-debug-bundle-<timestamp>.tar.gz here, or paste a gist URL."
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I am running the latest released version (or a specific commit, named above)
          required: true
        - label: I have searched existing issues for duplicates
          required: true
        - label: I have not pasted secrets (session, api_hash, message text) anywhere in this report
          required: true
        - label: "I confirm the attached debug-bundle does not contain my session string or api_hash (the CI grep-test enforces this; I have spot-checked the tar before uploading if I am extra paranoid)"
          required: true
        - label: This is **not** a security vulnerability — security issues go through GitHub Security Advisories, not public bug reports
          required: true
