name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Mirrors .commitlintrc.yml type-enum and lefthook commit-msg fallback.
          types: |
            feat
            fix
            perf
            security
            docs
            refactor
            test
            chore
            build
            ci
          requireScope: false
          subjectPattern: '^.{1,100}$'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.0.2
          args: --timeout=5m

  secret-scan:
    name: Secret scan (api_hash)
    runs-on: ubuntu-latest
    # The lefthook pre-commit hook runs the same script, but a hook is local
    # and skippable (--no-verify) and does not exist at all for a fork's PR.
    # This job is the actual gate: a published api_id is blocked by Telegram
    # permanently and would break login for every release user at once.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the range scan below needs the PR base commit, and a
          # shallow clone would make it fail to resolve rather than pass.
          fetch-depth: 0

      # Verify the matching rules before trusting their verdict. The gate has
      # leaked once already (an anchored pattern made `grep -o` skip every hex
      # run after the first on a line), and a scanner that silently stops
      # matching reports "clean" exactly like a scanner that found nothing.
      - name: Self-test the scanner
        run: ./scripts/secret-scan.sh --self-test

      - name: Scan tracked files
        run: ./scripts/secret-scan.sh --all

      # A tree scan only sees the branch tip. The likeliest real leak is a key
      # committed, noticed, and deleted in a follow-up commit: the tip is clean
      # while the key still rides into main in the history — which is precisely
      # what Telegram treats as published.
      - name: Scan commits added by this PR
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/secret-scan.sh --range "$BASE...$HEAD"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      # Search p95 SLA gate. BenchmarkSearch100k self-fails when p95 > 100 ms,
      # so the bench is run as a separate CI step rather than relying on a
      # follow-up `go test` invocation. Linux-only — the bench seeds 100k
      # rows and is sensitive to runner storage; macOS runners add noise.
      - name: Search SLA gate
        if: matrix.os == 'ubuntu-latest'
        run: make bench

      # Memory budget gate. Both tests skip under -short and fail the build
      # if HeapAlloc exceeds the documented v0.1.0 ceilings (idle <50 MiB,
      # active <150 MiB). Linux-only for the same reason as the search SLA:
      # macOS runners add scheduler noise that flakes the active-load drain
      # window without surfacing a real regression.
      - name: Memory budget gate
        if: matrix.os == 'ubuntu-latest'
        run: go test -v -timeout 180s -run "TestMemoryBudget" ./test/perf/...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false
        continue-on-error: true
