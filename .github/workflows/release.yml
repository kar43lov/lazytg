name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pre-release detection. The actual prerelease behavior (skip brew upload,
      # mark GitHub Release as prerelease) is handled inside .goreleaser.yaml via
      # `release.prerelease: auto` and `brews[].skip_upload: '{{ if .Prerelease }}true{{ end }}'`.
      # This step exists for CI log visibility and to expose outputs that follow-up
      # workflows could consume.
      - name: Detect prerelease
        id: prerel
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" =~ -(alpha|beta|rc)\. ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "skip_brew=true" >> $GITHUB_OUTPUT
            echo "skip_nfpm_publish=true" >> $GITHUB_OUTPUT
            echo "::notice title=Prerelease detected::Tag $TAG is a prerelease (alpha/beta/rc); brew formula will not be updated."
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "skip_brew=false" >> $GITHUB_OUTPUT
            echo "skip_nfpm_publish=false" >> $GITHUB_OUTPUT
            echo "::notice title=Stable release::Tag $TAG is a stable release; brew + nfpm will publish."
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # HOMEBREW_TAP_GITHUB_TOKEN may be unset on first release; goreleaser only
          # evaluates brews[].repository.token at upload time. For prerelease tags
          # `skip_upload: true` short-circuits the upload entirely, so an empty value
          # is acceptable. For stable tags this MUST be a PAT with contents:write
          # on pgmac/homebrew-lazytg (see docs/CONTRIBUTING.md → Release pipeline).
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          LAZYTG_IS_PRERELEASE: ${{ steps.prerel.outputs.prerelease }}
