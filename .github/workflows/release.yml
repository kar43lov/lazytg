name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual trigger fallback. Tags pushed by GITHUB_TOKEN (e.g. from
  # prerelease.yml) do NOT fire `on: push: tags` — GitHub blocks recursive
  # workflow dispatch. The maintainer can then run this workflow with the
  # tag ref via `gh workflow run release.yml --ref <tag>`.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag to release (e.g. v0.1.0-alpha.1)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # HOMEBREW_TAP_GITHUB_TOKEN may be unset on first release; goreleaser only
          # evaluates brews[].repository.token at upload time. For prerelease tags
          # `skip_upload: true` short-circuits the upload entirely, so an empty value
          # is acceptable. For stable tags this MUST be a PAT with contents:write
          # on pgmac/homebrew-lazytg (see docs/CONTRIBUTING.md → Release pipeline).
          # Prerelease detection (alpha/beta/rc tag suffix) is handled inside
          # .goreleaser.yaml via `release.prerelease: auto` and
          # `brews[].skip_upload: '{{ if .Prerelease }}true{{ end }}'`.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
