# git-cliff configuration for lazytg.
# Generates CHANGELOG.md from Conventional Commits.
# Run locally: git-cliff --tag <new-version> --unreleased --prepend CHANGELOG.md
# See https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }}\
            {% if commit.breaking %} (BREAKING){% endif %}
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
# Order matters: the first matching parser wins. Breaking changes are
# detected ahead of feat/fix so a `feat!: …` commit lands in the
# Breaking section instead of Added.
commit_parsers = [
  { message = "^[a-z]+(\\([^)]+\\))?!:", group = "Breaking" },
  { body = ".*BREAKING CHANGE", group = "Breaking" },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^security", group = "Security" },
  { message = "^docs", group = "Documentation" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^test", skip = true },
  { message = "^chore", skip = true },
  { message = "^Merge", skip = true },
]
filter_commits = false
tag_pattern = "v[0-9].*"
# Fold prerelease tags (alpha/beta/rc) into the next stable changelog
# section. Without this, `git-cliff --tag v0.1.0 --unreleased` would emit
# separate sections for every v0.1.0-alpha.N / -beta.N / -rc.N tag.
ignore_tags = "-(alpha|beta|rc)\\."
topo_order = false
sort_commits = "oldest"
